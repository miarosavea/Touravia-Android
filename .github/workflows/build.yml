name: Build Touravia APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            gradle assembleDebug
          else
            echo "ERREUR: Projet Android Gradle introuvable."
            echo "Le fichier touravia.zip doit etre extrait et son contenu ajoute au repository."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Touravia-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
