name: Build Touravia APK

on:
  workflow_dispatch:
  push:
    paths:
      - "touravia.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Touravia ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o touravia.zip -d extracted

      - name: Locate Android project
        run: |
          PROJECT_DIR="extracted/Touravia"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Tsy hita ny settings.gradle.kts"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload Touravia APK
        uses: actions/upload-artifact@v4
        with:
          name: Touravia-APK
          path: extracted/Touravia/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
